name: Build and cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: nixos-latest
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"

    steps:
      - name: Install Node.js action runtime
        shell: sh
        run: |
          set -eu
          node_path="$(nix build --no-link --print-out-paths nixpkgs#nodejs_24)"
          echo "$node_path/bin" >> "$FORGEJO_PATH"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Evaluate every supported system
        run: nix flake check --accept-flake-config --all-systems --no-build

      - name: Build native checks
        run: nix flake check --accept-flake-config

      - name: Build and push release outputs
        env:
          CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo "CACHIX_AUTH_TOKEN is not configured" >&2
            exit 1
          fi

          cachix_path="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#cachix)"
          nix build --accept-flake-config --no-link --print-out-paths \
            .#sing-box-for-desktop \
            .#sing-box-daemon \
            | "$cachix_path/bin/cachix" push sfd-nix
