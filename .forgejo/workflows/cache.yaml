name: Build and cache
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".zed/**"
      - LICENSE
  workflow_dispatch:
jobs:
  build:
    runs-on: nixos-latest
    timeout-minutes: 180
    enable-openid-connect: true
    env:
      CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
    steps:
      - name: Verify Cachix credentials
        shell: sh
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "CACHIX_AUTH_TOKEN is not configured" >&2
            exit 1
          fi
      - name: Verify Forgejo OIDC token access
        shell: sh
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "Forgejo OIDC is not enabled for this job" >&2
            exit 1
          fi
      - name: Install Node.js action runtime
        shell: sh
        run: |
          set -eu
          node_path="$(nix build --no-link --print-out-paths nixpkgs#nodejs_24)"
          echo "$node_path/bin" >> "$FORGEJO_PATH"
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Evaluate every supported system
        run: nix flake check --accept-flake-config --all-systems --no-build
      - name: Build checks and push release outputs
        shell: bash
        run: |
          set -euo pipefail
          system="$(nix eval --raw --impure --expr builtins.currentSystem)"

          outputs="$(nix build --accept-flake-config --no-link --print-out-paths \
            .#sing-box-for-desktop \
            .#sing-box-daemon)"
          nix build --accept-flake-config --no-link ".#checks.$system.module"

          cachix_path="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#cachix)"
          printf '%s\n' "$outputs" | "$cachix_path/bin/cachix" push sfd-nix
      - name: Push release outputs to niks3
        shell: bash
        env:
          NIKS3_SERVER_URL: https://amber.asnk.io
        run: |
          set -euo pipefail

          outputs_text="$(nix build --accept-flake-config --no-link --print-out-paths \
            .#sing-box-for-desktop \
            .#sing-box-daemon)"
          mapfile -t outputs <<< "$outputs_text"

          curl_path="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#curl.bin)"
          jq_path="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#jq.bin)"
          niks3_path="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#niks3)"

          # mktemp creates the file with mode 0600.
          token_file="$(mktemp)"
          trap 'rm -f "$token_file"' EXIT
          "$curl_path/bin/curl" -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$NIKS3_SERVER_URL" \
            | "$jq_path/bin/jq" -er .value > "$token_file"

          "$niks3_path/bin/niks3" push --auth-token-path "$token_file" "${outputs[@]}"
